name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    # A real Postgres so @runcell/postgres-credentials runs its integration
    # suite (row-lock queueing, refresh-race serialization) on every push.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: runcell
          POSTGRES_PASSWORD: runcell
          POSTGRES_DB: runcell_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runcell -d runcell_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUNCELL_PG_TEST_URL: postgres://runcell:runcell@localhost:5432/runcell_test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build first: the example resolves the harness package from its built
      # dist for lint + typecheck.
      - name: Build
        run: npm run build

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # VitePress fails on dead links, so this doubles as a docs link check.
      - name: Docs build
        run: npm run docs:build

  consumer:
    name: Packed consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Packs the tarball and installs it into throwaway apps: typecheck +
      # runtime against Zod 3 and Zod 4, with the Vercel peer kept optional.
      - name: Consumer smoke
        run: npm run test:consumer

  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    # Conventional Commits are enforced on PRs.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate PR commits
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
